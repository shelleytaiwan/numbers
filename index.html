<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>數字聽力練習｜填空即時批改｜Shelleytaiwan</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #fef8ef;
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
  }

  /* 頂部標題簡潔 */
  .global-header {
    background: #fff5e8;
    border-bottom: 2px solid #ffdfb3;
    padding: 12px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .global-header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.9rem;
    font-weight: 800;
    color: #e67e22;
    letter-spacing: 1px;
  }
  .global-header .sub {
    font-size: 0.75rem;
    color: #b97f44;
    margin-top: 4px;
  }

  /* 四大區塊橫向填滿 */
  .dashboard {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    min-height: calc(100vh - 76px);
  }

  .quadrant {
    flex: 1 1 25%;
    min-width: 250px;
    background: #fffbf5;
    border-right: 1px solid #ffefdb;
    padding: 24px 18px 28px;
    display: flex;
    flex-direction: column;
  }
  .quadrant:last-child {
    border-right: none;
  }

  /* 溫柔主題色 */
  .quadrant[data-type="phone"] { --accent: #ff8c5a; --bg-soft: #fff8f2; }
  .quadrant[data-type="money"] { --accent: #6fbf4c; --bg-soft: #f5fef0; }
  .quadrant[data-type="date"] { --accent: #f7b05e; --bg-soft: #fffaf2; }
  .quadrant[data-type="time"] { --accent: #e98a8a; --bg-soft: #fff7f5; }

  .card {
    background: var(--bg-soft);
    border-radius: 36px;
    padding: 24px 16px 28px;
    border: 1px solid #ffe3c9;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* 區塊標題 */
  .section-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    background: #ffffffcc;
    padding: 6px 16px;
    border-radius: 60px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }

  /* 喇叭按鈕 */
  .speaker-btn {
    background: white;
    border: 2px solid var(--accent);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 12px;
    border-radius: 60px;
    font-size: 1.25rem;
    font-weight: 600;
    cursor: pointer;
    margin: 8px 0 20px;
    transition: 0.2s;
    width: 100%;
  }
  .speaker-btn:hover {
    background: var(--accent);
    color: white;
  }

  /* 填空區 – 完全沒有任何提示文字，只有格子跟單位符號 */
  .blank-area {
    background: transparent;
    padding: 12px 8px;
    margin: 6px 0 8px;
    text-align: center;
  }

  .blank-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    margin: 8px 0;
  }

  /* 單純數字輸入框，無placeholder */
  .num-input {
    font-size: 2rem;
    width: 140px;
    text-align: center;
    padding: 10px 8px;
    border: 2px solid #ffdbb5;
    border-radius: 32px;
    background: white;
    font-family: monospace;
    font-weight: 700;
    color: #4a2e1a;
    outline: none;
  }
  .num-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.03);
  }

  .date-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 10px;
  }
  .small-input {
    font-size: 1.8rem;
    width: 100px;
    text-align: center;
    padding: 8px 6px;
    border: 2px solid #ffdbb5;
    border-radius: 32px;
    background: white;
    font-family: monospace;
    font-weight: 700;
  }
  .unit-text {
    font-size: 1.3rem;
    font-weight: 500;
    color: #bf8f60;
    margin: 0 2px;
  }

  /* 顯示答案的小按鈕 */
  .reveal-btn {
    background: #ede0d0;
    border: none;
    border-radius: 40px;
    padding: 6px 14px;
    font-size: 0.8rem;
    color: #8b694a;
    cursor: pointer;
    margin-top: 6px;
    width: fit-content;
    align-self: center;
  }
  .reveal-btn:hover {
    background: #e0cfbb;
  }

  /* 即時回饋: 只顯示 ⭕️ 或 ❌ */
  .live-feedback {
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 6px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 2px;
  }
  .feedback-correct { color: #3db87a; }
  .feedback-wrong { color: #e05555; }

  .next-btn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 12px 20px;
    border-radius: 60px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
    width: 100%;
    transition: 0.1s;
  }
  .next-btn:active { transform: scale(0.98); }

  .score-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 18px;
    background: #f5ede2;
    padding: 6px 12px;
    border-radius: 50px;
    font-size: 0.85rem;
    color: #a47348;
  }
  .score-row span {
    font-weight: 800;
    font-size: 1.15rem;
    color: var(--accent);
  }

  @media (max-width: 860px) {
    .dashboard { flex-direction: column; }
    .quadrant { border-right: none; border-bottom: 1px solid #ffefdb; }
    .num-input { font-size: 1.5rem; width: 120px; }
    .small-input { font-size: 1.4rem; width: 80px; }
  }
</style>
</head>
<body>
<div class="global-header">
  <h1>🔢 數字聽力練習</h1>
  <div class="sub">Shelleytaiwan AI · 智能「兩/二」發音 · 年月日分開數字</div>
</div>

<div class="dashboard">
  <!-- 1. 電話號碼 -->
  <div class="quadrant" data-type="phone">
    <div class="card">
      <div class="section-title"><span>📞</span> 電話號碼</div>
      <button class="speaker-btn" id="phone-speak">🔊 朗讀號碼</button>
      <div class="blank-area">
        <div class="blank-line">
          <input type="text" id="phone-input" class="num-input" autocomplete="off" inputmode="numeric" maxlength="9">
        </div>
      </div>
      <div class="live-feedback" id="phone-feedback"></div>
      <button class="reveal-btn" id="phone-reveal">📖 顯示答案</button>
      <button class="next-btn" id="phone-next">下一題 ➡</button>
      <div class="score-row">📋 已答 <span id="phone-answered">0</span> &nbsp; ✅ 正確 <span id="phone-correct">0</span></div>
    </div>
  </div>

  <!-- 2. 多少錢？ -->
  <div class="quadrant" data-type="money">
    <div class="card">
      <div class="section-title"><span>💰</span> 多少錢？</div>
      <button class="speaker-btn" id="money-speak">🔊 朗讀金額</button>
      <div class="blank-area">
        <div class="blank-line">
          <input type="text" id="money-input" class="num-input" autocomplete="off" inputmode="numeric">
          <span class="unit-text">元</span>
        </div>
      </div>
      <div class="live-feedback" id="money-feedback"></div>
      <button class="reveal-btn" id="money-reveal">📖 顯示答案</button>
      <button class="next-btn" id="money-next">下一題 ➡</button>
      <div class="score-row">📋 已答 <span id="money-answered">0</span> &nbsp; ✅ 正確 <span id="money-correct">0</span></div>
    </div>
  </div>

  <!-- 3. 日期：年 月 日 (只考年月日，不考星期) -->
  <div class="quadrant" data-type="date">
    <div class="card">
      <div class="section-title"><span>📅</span> 日期</div>
      <button class="speaker-btn" id="date-speak">🔊 朗讀日期</button>
      <div class="blank-area">
        <div class="date-group">
          <input type="text" id="date-year" class="small-input" autocomplete="off" inputmode="numeric" maxlength="4">
          <span class="unit-text">年</span>
          <input type="text" id="date-month" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2">
          <span class="unit-text">月</span>
          <input type="text" id="date-day" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2">
          <span class="unit-text">日</span>
        </div>
      </div>
      <div class="live-feedback" id="date-feedback"></div>
      <button class="reveal-btn" id="date-reveal">📖 顯示答案</button>
      <button class="next-btn" id="date-next">下一題 ➡</button>
      <div class="score-row">📋 已答 <span id="date-answered">0</span> &nbsp; ✅ 正確 <span id="date-correct">0</span></div>
    </div>
  </div>

  <!-- 4. 時間 (12小時制) -->
  <div class="quadrant" data-type="time">
    <div class="card">
      <div class="section-title"><span>⏰</span> 時間</div>
      <button class="speaker-btn" id="time-speak">🔊 朗讀時間</button>
      <div class="blank-area">
        <div class="date-group">
          <input type="text" id="time-hour" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2">
          <span class="unit-text">點</span>
          <input type="text" id="time-minute" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2">
          <span class="unit-text">分</span>
        </div>
      </div>
      <div class="live-feedback" id="time-feedback"></div>
      <button class="reveal-btn" id="time-reveal">📖 顯示答案</button>
      <button class="next-btn" id="time-next">下一題 ➡</button>
      <div class="score-row">📋 已答 <span id="time-answered">0</span> &nbsp; ✅ 正確 <span id="time-correct">0</span></div>
    </div>
  </div>
</div>

<script>
  // ---------- 語音 + 智能「兩/二」＋ 西元年份逐字朗讀 ----------
  
  // 年份專用：逐個數字朗讀 (例如 2013 -> 二 零 一 三)
  function yearDigitSpeech(year) {
    const map = {'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
    return year.toString().split('').map(ch => map[ch] || ch).join('');
  }
  
  // 一般數字轉中文（用於金額中的百千兩規則）
  function numberToChineseWithLiang(n, context = 'generic') {
    if (n === 0) return '零';
    const digits = ['零','一','二','三','四','五','六','七','八','九'];
    if (n < 10) return digits[n];
    let str = n.toString();
    let len = str.length;
    let result = '';
    const units = ['', '十', '百', '千', '萬'];
    for (let i = 0; i < len; i++) {
      let digit = parseInt(str[i], 10);
      let power = len - i - 1;
      if (digit === 0) {
        if (result.length > 0 && result.slice(-1) !== '零') result += '零';
        continue;
      }
      // 十位數為「1」且是整個數字的最高位時（10~19），只念「十」，不念「一十」
      if (digit === 1 && power === 1 && i === 0) {
        result += units[power];
        continue;
      }
      let digitChar = digits[digit];
      let shouldUseLiang = false;
      if (digit === 2) {
        if (power === 2) shouldUseLiang = true;      // 百位
        else if (power === 3) shouldUseLiang = true; // 千位
        else if (power === 4) shouldUseLiang = true; // 萬位
      }
      let finalDigit = (shouldUseLiang) ? '兩' : digitChar;
      result += finalDigit;
      if (power >= 1) result += units[power];
    }
    result = result.replace(/零+/g, '零').replace(/零$/, '');
    return result;
  }

  function moneySpeech(amount) { return numberToChineseWithLiang(amount, 'money') + '元'; }
  
  function timeSpeech12(hour, minute) {
    let hourCN = (hour === 2) ? '兩' : numberToChineseWithLiang(hour, 'time_hour');
    if (minute === 0) return `${hourCN}點整`;
    let minuteCN = numberToChineseWithLiang(minute, 'minute');
    return `${hourCN}點${minuteCN}分`;
  }
  
  // 日期朗讀：年份用逐字讀，月日用一般數字轉換（但月日中的2維持二，不會變兩）
  function dateSpeech(dateObj) {
    let yearStr = yearDigitSpeech(dateObj.year);  // 例如 "二零一三"
    let monthCN = numberToChineseWithLiang(dateObj.month, 'month');
    let dayCN = numberToChineseWithLiang(dateObj.day, 'day');
    return `${yearStr}年${monthCN}月${dayCN}日`;
  }
  
  function phoneSpeech(numStr) {
    const map = {'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
    return numStr.split('').map(ch => map[ch] || ch).join(' ');
  }

  // 電話號碼逐字慢速朗讀：每個數字獨立發音，中間停頓，避免念太快聽不清楚
  function speakPhoneDigits(numStr, rate = 0.6, gapMs = 320) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const map = {'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
    const chars = numStr.split('').map(ch => map[ch] || ch);
    const pickVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      return voices.find(v => v.lang === 'zh-TW' && /Taiwan|Meijia|Tingting|Yating/i.test(v.name)) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh'));
    };
    let i = 0;
    function speakNext(voice) {
      if (i >= chars.length) return;
      const utter = new SpeechSynthesisUtterance(chars[i]);
      utter.lang = 'zh-TW';
      utter.rate = rate;
      if (voice) utter.voice = voice;
      utter.onend = () => { i++; setTimeout(() => speakNext(voice), gapMs); };
      window.speechSynthesis.speak(utter);
    }
    if (window.speechSynthesis.getVoices().length) {
      speakNext(pickVoice());
    } else {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged = null; speakNext(pickVoice()); };
    }
  }

  function speakText(text, rate = 0.85) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    utter.rate = rate;
    const setVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      const tw = voices.find(v => v.lang === 'zh-TW' && /Taiwan|Meijia|Tingting|Yating/i.test(v.name)) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh'));
      if (tw) utter.voice = tw;
      window.speechSynthesis.speak(utter);
    };
    if (window.speechSynthesis.getVoices().length) setVoice();
    else window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged = null; setVoice(); };
  }

  // ========== 1. 電話號碼 ==========
  let currentPhone = null, phoneAns=0, phoneCor=0, phoneLock=false;
  function genPhone() { let first='09'; let rest=Math.floor(Math.random()*10000000).toString().padStart(7,'0'); return first+rest; }
  function updatePhoneUI() { document.getElementById('phone-answered').innerText=phoneAns; document.getElementById('phone-correct').innerText=phoneCor; localStorage.setItem('phoneStats',JSON.stringify({a:phoneAns,c:phoneCor})); }
  function loadPhone() { try{ let d=JSON.parse(localStorage.getItem('phoneStats')); if(d){ phoneAns=d.a; phoneCor=d.c; updatePhoneUI(); } }catch(e){} }
  function newPhone() { currentPhone=genPhone(); phoneLock=false; document.getElementById('phone-input').value=''; document.getElementById('phone-feedback').innerHTML=''; document.getElementById('phone-feedback').className='live-feedback'; }
  function speakPhone() { if(!currentPhone) newPhone(); speakPhoneDigits(currentPhone, 0.6, 320); }
  function checkPhone() {
    if(phoneLock) return;
    let val=document.getElementById('phone-input').value.trim().replace(/\D/g,'');
    let fb=document.getElementById('phone-feedback');
    if(val.length!==9) { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; return; }
    if(val===currentPhone) { if(!phoneLock){ phoneLock=true; phoneAns++; phoneCor++; updatePhoneUI(); } fb.innerHTML='⭕️'; fb.className='live-feedback feedback-correct'; }
    else { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; }
  }
  function revealPhone() { if(currentPhone) document.getElementById('phone-feedback').innerHTML=`🔍 ${currentPhone}`; }

  // ========== 2. 金額 ==========
  let currentMoney=null, moneyAns=0, moneyCor=0, moneyLock=false;
  function genMoney() { return Math.floor(Math.random()*(99999-10+1)+10); }
  function updateMoneyUI() { document.getElementById('money-answered').innerText=moneyAns; document.getElementById('money-correct').innerText=moneyCor; localStorage.setItem('moneyStats',JSON.stringify({a:moneyAns,c:moneyCor})); }
  function loadMoney() { try{ let d=JSON.parse(localStorage.getItem('moneyStats')); if(d){ moneyAns=d.a; moneyCor=d.c; updateMoneyUI(); } }catch(e){} }
  function newMoney() { currentMoney=genMoney(); moneyLock=false; document.getElementById('money-input').value=''; document.getElementById('money-feedback').innerHTML=''; document.getElementById('money-feedback').className='live-feedback'; }
  function speakMoney() { if(!currentMoney) newMoney(); speakText(moneySpeech(currentMoney),0.8); }
  function checkMoney() {
    if(moneyLock) return;
    let val=document.getElementById('money-input').value.trim();
    let fb=document.getElementById('money-feedback');
    if(!val) { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; return; }
    let num=Number(val);
    if(isNaN(num)) { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; return; }
    if(num===currentMoney) { if(!moneyLock){ moneyLock=true; moneyAns++; moneyCor++; updateMoneyUI(); } fb.innerHTML='⭕️'; fb.className='live-feedback feedback-correct'; }
    else { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; }
  }
  function revealMoney() { if(currentMoney) document.getElementById('money-feedback').innerHTML=`🔍 ${currentMoney} 元`; }

  // ========== 3. 日期 (年月日，無星期) ==========
  let currentDate=null, dateAns=0, dateCor=0, dateLock=false;
  function genDate() {
    let y=Math.floor(Math.random()*(2026-1950+1)+1950);
    let m=Math.floor(Math.random()*12)+1;
    let maxD=(m===2)?28:([4,6,9,11].includes(m)?30:31);
    let d=Math.floor(Math.random()*maxD)+1;
    return {year:y, month:m, day:d};
  }
  function updateDateUI() { document.getElementById('date-answered').innerText=dateAns; document.getElementById('date-correct').innerText=dateCor; localStorage.setItem('dateStats',JSON.stringify({a:dateAns,c:dateCor})); }
  function loadDate() { try{ let d=JSON.parse(localStorage.getItem('dateStats')); if(d){ dateAns=d.a; dateCor=d.c; updateDateUI(); } }catch(e){} }
  function newDate() { currentDate=genDate(); dateLock=false; document.getElementById('date-year').value=''; document.getElementById('date-month').value=''; document.getElementById('date-day').value=''; document.getElementById('date-feedback').innerHTML=''; document.getElementById('date-feedback').className='live-feedback'; }
  function speakDate() { if(!currentDate) newDate(); speakText(dateSpeech(currentDate),0.88); }
  function checkDate() {
    if(dateLock) return;
    let y=document.getElementById('date-year').value.trim(), m=document.getElementById('date-month').value.trim(), d=document.getElementById('date-day').value.trim();
    let fb=document.getElementById('date-feedback');
    if(!y||!m||!d) { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; return; }
    let yy=parseInt(y,10), mm=parseInt(m,10), dd=parseInt(d,10);
    if(isNaN(yy)||isNaN(mm)||isNaN(dd)) { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; return; }
    if(yy===currentDate.year && mm===currentDate.month && dd===currentDate.day) {
      if(!dateLock){ dateLock=true; dateAns++; dateCor++; updateDateUI(); } fb.innerHTML='⭕️'; fb.className='live-feedback feedback-correct';
    } else { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; }
  }
  function revealDate() { if(currentDate) document.getElementById('date-feedback').innerHTML=`🔍 ${currentDate.year}年 ${currentDate.month}月 ${currentDate.day}日`; }

  // ========== 4. 時間 ==========
  let currentTime=null, timeAns=0, timeCor=0, timeLock=false;
  function genTime() { return { hour: Math.floor(Math.random()*12)+1, minute: Math.floor(Math.random()*60) }; }
  function updateTimeUI() { document.getElementById('time-answered').innerText=timeAns; document.getElementById('time-correct').innerText=timeCor; localStorage.setItem('timeStats',JSON.stringify({a:timeAns,c:timeCor})); }
  function loadTime() { try{ let d=JSON.parse(localStorage.getItem('timeStats')); if(d){ timeAns=d.a; timeCor=d.c; updateTimeUI(); } }catch(e){} }
  function newTime() { currentTime=genTime(); timeLock=false; document.getElementById('time-hour').value=''; document.getElementById('time-minute').value=''; document.getElementById('time-feedback').innerHTML=''; document.getElementById('time-feedback').className='live-feedback'; }
  function speakTime() { if(!currentTime) newTime(); speakText(timeSpeech12(currentTime.hour, currentTime.minute),0.85); }
  function checkTime() {
    if(timeLock) return;
    let h=document.getElementById('time-hour').value.trim(), m=document.getElementById('time-minute').value.trim();
    let fb=document.getElementById('time-feedback');
    if(!h||!m) { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; return; }
    let hh=parseInt(h,10), mm=parseInt(m,10);
    if(isNaN(hh)||isNaN(mm)) { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; return; }
    if(hh===currentTime.hour && mm===currentTime.minute) {
      if(!timeLock){ timeLock=true; timeAns++; timeCor++; updateTimeUI(); } fb.innerHTML='⭕️'; fb.className='live-feedback feedback-correct';
    } else { fb.innerHTML='❌'; fb.className='live-feedback feedback-wrong'; }
  }
  function revealTime() { if(currentTime) document.getElementById('time-feedback').innerHTML=`🔍 ${currentTime.hour}點${currentTime.minute}分`; }

  // 即時監聽
  function bindLive() {
    document.getElementById('phone-input').addEventListener('input',()=>{ if(!phoneLock) checkPhone(); });
    document.getElementById('money-input').addEventListener('input',()=>{ if(!moneyLock) checkMoney(); });
    ['date-year','date-month','date-day'].forEach(id=>{ document.getElementById(id).addEventListener('input',()=>{ if(!dateLock) checkDate(); }); });
    document.getElementById('time-hour').addEventListener('input',()=>{ if(!timeLock) checkTime(); });
    document.getElementById('time-minute').addEventListener('input',()=>{ if(!timeLock) checkTime(); });
  }
  function bindButtons() {
    document.getElementById('phone-next').onclick=newPhone;
    document.getElementById('money-next').onclick=newMoney;
    document.getElementById('date-next').onclick=newDate;
    document.getElementById('time-next').onclick=newTime;
    document.getElementById('phone-reveal').onclick=revealPhone;
    document.getElementById('money-reveal').onclick=revealMoney;
    document.getElementById('date-reveal').onclick=revealDate;
    document.getElementById('time-reveal').onclick=revealTime;
    document.getElementById('phone-speak').onclick=speakPhone;
    document.getElementById('money-speak').onclick=speakMoney;
    document.getElementById('date-speak').onclick=speakDate;
    document.getElementById('time-speak').onclick=speakTime;
  }

  function init() {
    loadPhone(); loadMoney(); loadDate(); loadTime();
    newPhone(); newMoney(); newDate(); newTime();
    bindLive(); bindButtons();
  }
  window.addEventListener('load', init);
</script>
</body>
</html>
