<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數字聽寫 · 防呆升級版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light;--bg:#EFE9DF;--card:#F8F4EC;--ink:#2B1D1A;--muted:#8C7B70;--line:#D6CCBD;--hl:#9A3F22}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:clamp(17px,2vw,22px);line-height:1.6;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{position:relative;max-width:950px;width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:72px 20px 48px}
.home{position:absolute;left:20px;top:calc(20px + env(safe-area-inset-top,0px));color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:2px;transition:transform .15s,box-shadow .15s,border-color .15s}
.home:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:.12em;line-height:1.3;text-align:center}
.langs{display:flex;justify-content:center;gap:10px;margin-top:clamp(24px,4vh,36px)}
button{font-family:inherit;font-size:clamp(17px,2.1vw,24px);font-weight:700;border-radius:2px;border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:14px 26px;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
button:focus-visible,.home:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.langs button{font-size:clamp(15px,1.7vw,18px);padding:8px 18px}
button.active,.speaker-btn{background:var(--ink);color:var(--card)}
.dashboard{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:clamp(24px,4vh,36px);align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:22px;display:flex;flex-direction:column;gap:22px}
.section-title{font-family:"Noto Serif TC",serif;font-size:clamp(22px,2.8vw,28px);font-weight:700;text-align:center}
.speaker-btn{width:100%}
.blank-line,.date-group{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:10px}
.num-input,.small-input{font-family:"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px 8px}
.num-input{font-size:clamp(26px,3.6vw,38px);width:min(100%,260px)}
.small-input{font-size:clamp(24px,3.2vw,34px);width:clamp(76px,10vw,100px)}
.num-input:focus,.small-input:focus{outline:none;border-color:var(--ink)}
.unit-text{font-size:clamp(18px,2.2vw,24px);font-weight:500;color:var(--muted)}
.live-feedback{font-family:"Noto Serif TC",serif;font-size:clamp(34px,4.4vw,44px);font-weight:900;text-align:center;line-height:1.2;min-height:56px;display:flex;align-items:center;justify-content:center}
.feedback-correct{color:var(--ink)}
.feedback-wrong{color:var(--hl)}
.feedback-reveal{font-family:"Noto Sans TC",sans-serif;font-size:clamp(22px,3vw,30px);font-weight:700;color:var(--ink)}
.btn-row{display:flex;gap:14px}
.btn-row button{flex:1;font-size:clamp(15px,1.8vw,19px);padding:12px 8px}
.score-row{display:flex;justify-content:center;gap:22px;font-size:clamp(14px,1.7vw,17px);color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.score-row span{font-weight:700;color:var(--ink);font-size:clamp(17px,2vw,22px)}
footer{text-align:center;padding-top:clamp(26px,4.5vh,44px);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.voice-warning{font-size:clamp(12px,1.4vw,15px);color:var(--hl);font-weight:700;text-align:center;margin-top:6px;min-height:1.4em}
@media(max-width:640px){
  #app{padding:16px 14px 48px}
  .home{position:static;align-self:flex-start;margin-bottom:22px;font-size:14px}
  .dashboard{grid-template-columns:1fr}
  .card{padding:20px}
}
@media(prefers-reduced-motion:reduce){button,.home{transition:none}}
.ico-spk{display:block;width:1.3em;height:1em;margin:0 auto;flex:none}
.speaker-btn .ico-spk{width:clamp(34px,4vw,46px);height:clamp(26px,3vw,36px)}.speaker-btn{padding:12px 26px}
</style>
</head>
<body>
<div id="app">
<a class="home" href="https://shelleytaiwan.github.io/learning-toolkits/">← 返回主頁</a>
<h1>數字聽寫</h1>
<div class="langs" id="script-toggle" data-keep>
  <button type="button" id="btn-trad" class="active">繁體</button>
  <button type="button" id="btn-simp">简体</button>
</div>
<div class="dashboard">
  <!-- 電話號碼 -->
  <div class="card" data-type="phone">
    <div class="section-title">電話號碼</div>
    <button class="speaker-btn" id="phone-speak" title="朗讀號碼" aria-label="朗讀號碼"><svg class="ico-spk" viewBox="0 0 1166 896" aria-hidden="true"><path fill="currentColor" d="M95 232H203L455 14Q500 -10 535 20Q552 38 552 62V834Q552 862 535 878Q500 905 455 878L203 663H95Q0 663 0 568V327Q0 232 95 232Z"/><g fill="none" stroke="currentColor" stroke-width="62" stroke-linecap="round"><path d="M722 352C762 385 770 420 770 448C770 476 762 511 722 544"/><path d="M838 207C915 270 951 350 951 448C951 546 915 626 838 685"/><path d="M955 65C1070 160 1135 300 1135 448C1135 596 1070 736 955 830"/></g></svg></button>
    <div class="blank-line"><input type="text" id="phone-input" class="num-input" autocomplete="off" inputmode="numeric" maxlength="10" placeholder="輸入號碼"></div>
    <div class="live-feedback" id="phone-feedback"></div>
    <div class="voice-warning" id="phone-warning"></div>
    <div class="btn-row">
      <button id="phone-reveal">顯示答案</button>
      <button id="phone-check">檢查答案</button>
      <button id="phone-next">下一題</button>
    </div>
    <div class="score-row"><div>已答 <span id="phone-answered">0</span></div><div>正確 <span id="phone-correct">0</span></div></div>
  </div>

  <!-- 多少錢 -->
  <div class="card" data-type="money">
    <div class="section-title">多少錢？</div>
    <button class="speaker-btn" id="money-speak" title="朗讀金額" aria-label="朗讀金額"><svg class="ico-spk" viewBox="0 0 1166 896" aria-hidden="true"><path fill="currentColor" d="M95 232H203L455 14Q500 -10 535 20Q552 38 552 62V834Q552 862 535 878Q500 905 455 878L203 663H95Q0 663 0 568V327Q0 232 95 232Z"/><g fill="none" stroke="currentColor" stroke-width="62" stroke-linecap="round"><path d="M722 352C762 385 770 420 770 448C770 476 762 511 722 544"/><path d="M838 207C915 270 951 350 951 448C951 546 915 626 838 685"/><path d="M955 65C1070 160 1135 300 1135 448C1135 596 1070 736 955 830"/></g></svg></button>
    <div class="blank-line"><input type="text" id="money-input" class="num-input" autocomplete="off" inputmode="numeric" placeholder="輸入金額"><span class="unit-text">元</span></div>
    <div class="live-feedback" id="money-feedback"></div>
    <div class="voice-warning" id="money-warning"></div>
    <div class="btn-row">
      <button id="money-reveal">顯示答案</button>
      <button id="money-check">檢查答案</button>
      <button id="money-next">下一題</button>
    </div>
    <div class="score-row"><div>已答 <span id="money-answered">0</span></div><div>正確 <span id="money-correct">0</span></div></div>
  </div>

  <!-- 日期 -->
  <div class="card" data-type="date">
    <div class="section-title">日期</div>
    <button class="speaker-btn" id="date-speak" title="朗讀日期" aria-label="朗讀日期"><svg class="ico-spk" viewBox="0 0 1166 896" aria-hidden="true"><path fill="currentColor" d="M95 232H203L455 14Q500 -10 535 20Q552 38 552 62V834Q552 862 535 878Q500 905 455 878L203 663H95Q0 663 0 568V327Q0 232 95 232Z"/><g fill="none" stroke="currentColor" stroke-width="62" stroke-linecap="round"><path d="M722 352C762 385 770 420 770 448C770 476 762 511 722 544"/><path d="M838 207C915 270 951 350 951 448C951 546 915 626 838 685"/><path d="M955 65C1070 160 1135 300 1135 448C1135 596 1070 736 955 830"/></g></svg></button>
    <div class="date-group"><input type="text" id="date-year" class="small-input" autocomplete="off" inputmode="numeric" maxlength="4" placeholder="年"><span class="unit-text">年</span><input type="text" id="date-month" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2" placeholder="月"><span class="unit-text">月</span><input type="text" id="date-day" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2" placeholder="日"><span class="unit-text">日</span></div>
    <div class="live-feedback" id="date-feedback"></div>
    <div class="voice-warning" id="date-warning"></div>
    <div class="btn-row">
      <button id="date-reveal">顯示答案</button>
      <button id="date-check">檢查答案</button>
      <button id="date-next">下一題</button>
    </div>
    <div class="score-row"><div>已答 <span id="date-answered">0</span></div><div>正確 <span id="date-correct">0</span></div></div>
  </div>

  <!-- 時間 -->
  <div class="card" data-type="time">
    <div class="section-title">時間</div>
    <button class="speaker-btn" id="time-speak" title="朗讀時間" aria-label="朗讀時間"><svg class="ico-spk" viewBox="0 0 1166 896" aria-hidden="true"><path fill="currentColor" d="M95 232H203L455 14Q500 -10 535 20Q552 38 552 62V834Q552 862 535 878Q500 905 455 878L203 663H95Q0 663 0 568V327Q0 232 95 232Z"/><g fill="none" stroke="currentColor" stroke-width="62" stroke-linecap="round"><path d="M722 352C762 385 770 420 770 448C770 476 762 511 722 544"/><path d="M838 207C915 270 951 350 951 448C951 546 915 626 838 685"/><path d="M955 65C1070 160 1135 300 1135 448C1135 596 1070 736 955 830"/></g></svg></button>
    <div class="date-group"><input type="text" id="time-hour" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2" placeholder="時"><span class="unit-text">點</span><input type="text" id="time-minute" class="small-input" autocomplete="off" inputmode="numeric" maxlength="2" placeholder="分"><span class="unit-text">分</span></div>
    <div class="live-feedback" id="time-feedback"></div>
    <div class="voice-warning" id="time-warning"></div>
    <div class="btn-row">
      <button id="time-reveal">顯示答案</button>
      <button id="time-check">檢查答案</button>
      <button id="time-next">下一題</button>
    </div>
    <div class="score-row"><div>已答 <span id="time-answered">0</span></div><div>正確 <span id="time-correct">0</span></div></div>
  </div>
</div>
<footer>Shelleytaiwan 製作 · 2027 · 請勿商用</footer>
</div>

<script>
/* ============================================================
   數字聽寫 · 修正電話「一」發音問題
   將原本的 replace(/一/g, '幺') 註解掉，改為標準的「一 (yī)」
   ============================================================ */

// ---------- 全局狀態 ----------
let currentScript = 'trad';
let voiceWarningTimers = {};

const currentData = {
  phone: { answer: '0912345678', text: '零九一二三四五六七八' },
  money: { answer: '100', text: '一百元' },
  date: { answer: { year: '2026', month: '11', day: '14' }, text: '二零二六年十一月十四日' },
  time: { answer: { hour: '8', minute: '49' }, text: '八點四十九分' }
};

const scores = {
  phone: { answered: 0, correct: 0 },
  money: { answered: 0, correct: 0 },
  date: { answered: 0, correct: 0 },
  time: { answered: 0, correct: 0 }
};

const graded = { phone: false, money: false, date: false, time: false };

// ---------- DOM 元素 ----------
const els = {
  btnTrad: document.getElementById('btn-trad'),
  btnSimp: document.getElementById('btn-simp'),
  phoneInput: document.getElementById('phone-input'),
  phoneFeedback: document.getElementById('phone-feedback'),
  phoneWarning: document.getElementById('phone-warning'),
  phoneSpeak: document.getElementById('phone-speak'),
  phoneReveal: document.getElementById('phone-reveal'),
  phoneCheck: document.getElementById('phone-check'),
  phoneNext: document.getElementById('phone-next'),
  phoneAnswered: document.getElementById('phone-answered'),
  phoneCorrect: document.getElementById('phone-correct'),
  moneyInput: document.getElementById('money-input'),
  moneyFeedback: document.getElementById('money-feedback'),
  moneyWarning: document.getElementById('money-warning'),
  moneySpeak: document.getElementById('money-speak'),
  moneyReveal: document.getElementById('money-reveal'),
  moneyCheck: document.getElementById('money-check'),
  moneyNext: document.getElementById('money-next'),
  moneyAnswered: document.getElementById('money-answered'),
  moneyCorrect: document.getElementById('money-correct'),
  dateYear: document.getElementById('date-year'),
  dateMonth: document.getElementById('date-month'),
  dateDay: document.getElementById('date-day'),
  dateFeedback: document.getElementById('date-feedback'),
  dateWarning: document.getElementById('date-warning'),
  dateSpeak: document.getElementById('date-speak'),
  dateReveal: document.getElementById('date-reveal'),
  dateCheck: document.getElementById('date-check'),
  dateNext: document.getElementById('date-next'),
  dateAnswered: document.getElementById('date-answered'),
  dateCorrect: document.getElementById('date-correct'),
  timeHour: document.getElementById('time-hour'),
  timeMinute: document.getElementById('time-minute'),
  timeFeedback: document.getElementById('time-feedback'),
  timeWarning: document.getElementById('time-warning'),
  timeSpeak: document.getElementById('time-speak'),
  timeReveal: document.getElementById('time-reveal'),
  timeCheck: document.getElementById('time-check'),
  timeNext: document.getElementById('time-next'),
  timeAnswered: document.getElementById('time-answered'),
  timeCorrect: document.getElementById('time-correct')
};

// ---------- 語音引擎 ----------
let isAudioUnlocked = false;

function getVoiceByScript(script) {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  if (script === 'trad') {
    return voices.find(v =>
      v.name.includes('Mei-Jia') || v.name.includes('美佳') ||
      v.name.toLowerCase().includes('meijia') || v.name.includes('MeiJia')
    ) || null;
  } else {
    return voices.find(v =>
      v.name.includes('Tingting') || v.name.includes('婷婷') ||
      v.name.toLowerCase().includes('tingting')
    ) || null;
  }
}

function applyToneSandhi(text, isPhone = false) {
  if (!text) return '';
  let res = text;
  if (isPhone) {
    // 【修正】取消把「一」轉成「幺」，讓它維持原本的「一 (yī)」
    // res = res.replace(/一/g, '幺');
  } else {
    res = res.replace(/一(萬|月|日|萬元|月分|號)/g, '移$1');
    res = res.replace(/一(百|千|年|點|分|天|元|個|張|本|條|塊)/g, '意$1');
  }
  return res;
}

function speakText(text, isPhone, warningEl, typeKey) {
  if (!('speechSynthesis' in window)) {
    alert('您的瀏覽器不支援語音合成功能');
    return;
  }

  if (voiceWarningTimers[typeKey]) {
    clearTimeout(voiceWarningTimers[typeKey]);
    voiceWarningTimers[typeKey] = null;
  }
  warningEl.textContent = '';

  if (!isAudioUnlocked) {
    try {
      const unlock = new SpeechSynthesisUtterance('');
      window.speechSynthesis.speak(unlock);
    } catch (e) {}
    isAudioUnlocked = true;
  }

  window.speechSynthesis.cancel();
  try { window.speechSynthesis.resume(); } catch (e) {}

  const processed = applyToneSandhi(text, isPhone);
  const utterance = new SpeechSynthesisUtterance(processed);
  utterance.rate = 0.9;
  utterance.pitch = 1.0;
  utterance.lang = currentScript === 'trad' ? 'zh-TW' : 'zh-CN';

  const targetVoice = getVoiceByScript(currentScript);
  if (targetVoice) {
    utterance.voice = targetVoice;
  } else {
    warningEl.textContent = currentScript === 'trad'
      ? '⚠️ 找不到美佳語音，請確認系統已安裝'
      : '⚠️ 找不到婷婷語音，請確認系統已安裝';
  }

  voiceWarningTimers[typeKey] = setTimeout(() => {
    warningEl.textContent = '⚠️ 語音無反應，請重開瀏覽器（Command + Q）';
  }, 2000);

  utterance.onend = () => {
    if (voiceWarningTimers[typeKey]) {
      clearTimeout(voiceWarningTimers[typeKey]);
      voiceWarningTimers[typeKey] = null;
    }
    warningEl.textContent = '';
  };

  utterance.onerror = () => {
    if (voiceWarningTimers[typeKey]) {
      clearTimeout(voiceWarningTimers[typeKey]);
      voiceWarningTimers[typeKey] = null;
    }
    warningEl.textContent = '⚠️ 語音發生錯誤，請重開瀏覽器（Command + Q）';
  };

  setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 50);
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

// ---------- 隨機出題 ----------
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generatePhone() {
  let num = '09';
  for (let i = 0; i < 8; i++) num += randInt(0, 9);
  const digits = num.split('');
  const map = ['零','一','二','三','四','五','六','七','八','九'];
  const text = digits.map(d => map[parseInt(d)]).join('');
  return { answer: num, text };
}

function generateMoney() {
  const amount = randInt(1, 9999);
  const answer = String(amount);
  let text = '';
  const map = ['零','一','二','三','四','五','六','七','八','九'];
  if (amount >= 1000) {
    const thousands = Math.floor(amount / 1000);
    const hundreds = Math.floor((amount % 1000) / 100);
    const tens = Math.floor((amount % 100) / 10);
    const ones = amount % 10;
    if (thousands > 0) text += map[thousands] + '千';
    if (hundreds > 0) text += map[hundreds] + '百';
    else if (thousands > 0 && (tens > 0 || ones > 0)) text += '零';
    if (tens > 0) text += map[tens] + '十';
    else if (hundreds > 0 && ones > 0) text += '零';
    if (ones > 0) text += map[ones];
  } else if (amount >= 100) {
    const hundreds = Math.floor(amount / 100);
    const tens = Math.floor((amount % 100) / 10);
    const ones = amount % 10;
    text += map[hundreds] + '百';
    if (tens > 0) text += map[tens] + '十';
    else if (ones > 0) text += '零';
    if (ones > 0) text += map[ones];
  } else if (amount >= 10) {
    const tens = Math.floor(amount / 10);
    const ones = amount % 10;
    text += map[tens] + '十';
    if (ones > 0) text += map[ones];
  } else {
    text += map[amount];
  }
  text += '元';
  return { answer, text };
}

function generateDate() {
  const year = randInt(2020, 2030);
  const month = randInt(1, 12);
  const day = randInt(1, 28);
  const map = ['零','一','二','三','四','五','六','七','八','九'];
  function yearToChinese(y) {
    return String(y).split('').map(d => map[parseInt(d)]).join('');
  }
  function numToChinese(n) {
    if (n <= 10) return map[n];
    if (n < 20) return '十' + (n % 10 === 0 ? '' : map[n % 10]);
    return map[Math.floor(n / 10)] + '十' + (n % 10 === 0 ? '' : map[n % 10]);
  }
  const text = yearToChinese(year) + '年' + numToChinese(month) + '月' + numToChinese(day) + '日';
  return { answer: { year: String(year), month: String(month), day: String(day) }, text };
}

function generateTime() {
  const hour = randInt(1, 12);
  const minute = randInt(0, 59);
  const map = ['零','一','二','三','四','五','六','七','八','九'];
  function numToChinese(n) {
    if (n <= 10) return map[n];
    if (n < 20) return '十' + (n % 10 === 0 ? '' : map[n % 10]);
    return map[Math.floor(n / 10)] + '十' + (n % 10 === 0 ? '' : map[n % 10]);
  }
  let text = numToChinese(hour) + '點';
  if (minute === 0) {
    text += '整';
  } else if (minute < 10) {
    text += '零' + map[minute] + '分';
  } else {
    text += numToChinese(minute) + '分';
  }
  return { answer: { hour: String(hour), minute: String(minute) }, text };
}

// ---------- 批改邏輯 ----------
function gradePhone() {
  if (graded.phone) return;
  const input = els.phoneInput.value.trim();
  if (input === '') return;
  graded.phone = true;
  scores.phone.answered++;
  const isCorrect = input === currentData.phone.answer;
  if (isCorrect) scores.phone.correct++;
  els.phoneAnswered.textContent = scores.phone.answered;
  els.phoneCorrect.textContent = scores.phone.correct;
  els.phoneFeedback.innerHTML = isCorrect
    ? '<span class="feedback-correct">✓ 正確</span>'
    : '<span class="feedback-wrong">✗ 再試試</span>';
}

function gradeMoney() {
  if (graded.money) return;
  const input = els.moneyInput.value.trim();
  if (input === '') return;
  graded.money = true;
  scores.money.answered++;
  const isCorrect = input === currentData.money.answer;
  if (isCorrect) scores.money.correct++;
  els.moneyAnswered.textContent = scores.money.answered;
  els.moneyCorrect.textContent = scores.money.correct;
  els.moneyFeedback.innerHTML = isCorrect
    ? '<span class="feedback-correct">✓ 正確</span>'
    : '<span class="feedback-wrong">✗ 再試試</span>';
}

function gradeDate() {
  if (graded.date) return;
  const y = els.dateYear.value.trim();
  const m = els.dateMonth.value.trim();
  const d = els.dateDay.value.trim();
  if (y === '' || m === '' || d === '') return;
  graded.date = true;
  scores.date.answered++;
  const ans = currentData.date.answer;
  const isCorrect = (y === ans.year && m === ans.month && d === ans.day);
  if (isCorrect) scores.date.correct++;
  els.dateAnswered.textContent = scores.date.answered;
  els.dateCorrect.textContent = scores.date.correct;
  els.dateFeedback.innerHTML = isCorrect
    ? '<span class="feedback-correct">✓ 正確</span>'
    : '<span class="feedback-wrong">✗ 再試試</span>';
}

function gradeTime() {
  if (graded.time) return;
  const h = els.timeHour.value.trim();
  const m = els.timeMinute.value.trim();
  if (h === '' || m === '') return;
  graded.time = true;
  scores.time.answered++;
  const ans = currentData.time.answer;
  const isCorrect = (h === ans.hour && m === ans.minute);
  if (isCorrect) scores.time.correct++;
  els.timeAnswered.textContent = scores.time.answered;
  els.timeCorrect.textContent = scores.time.correct;
  els.timeFeedback.innerHTML = isCorrect
    ? '<span class="feedback-correct">✓ 正確</span>'
    : '<span class="feedback-wrong">✗ 再試試</span>';
}

// ---------- 下一題 ----------
function nextPhone() {
  currentData.phone = generatePhone();
  els.phoneInput.value = '';
  els.phoneFeedback.innerHTML = '';
  els.phoneWarning.textContent = '';
  graded.phone = false;
  if (voiceWarningTimers.phone) { clearTimeout(voiceWarningTimers.phone); voiceWarningTimers.phone = null; }
}

function nextMoney() {
  currentData.money = generateMoney();
  els.moneyInput.value = '';
  els.moneyFeedback.innerHTML = '';
  els.moneyWarning.textContent = '';
  graded.money = false;
  if (voiceWarningTimers.money) { clearTimeout(voiceWarningTimers.money); voiceWarningTimers.money = null; }
}

function nextDate() {
  currentData.date = generateDate();
  els.dateYear.value = '';
  els.dateMonth.value = '';
  els.dateDay.value = '';
  els.dateFeedback.innerHTML = '';
  els.dateWarning.textContent = '';
  graded.date = false;
  if (voiceWarningTimers.date) { clearTimeout(voiceWarningTimers.date); voiceWarningTimers.date = null; }
}

function nextTime() {
  currentData.time = generateTime();
  els.timeHour.value = '';
  els.timeMinute.value = '';
  els.timeFeedback.innerHTML = '';
  els.timeWarning.textContent = '';
  graded.time = false;
  if (voiceWarningTimers.time) { clearTimeout(voiceWarningTimers.time); voiceWarningTimers.time = null; }
}

// ---------- 顯示答案 ----------
function revealPhone() {
  els.phoneFeedback.innerHTML = '<span class="feedback-reveal">答案：' + currentData.phone.answer + '</span>';
}
function revealMoney() {
  els.moneyFeedback.innerHTML = '<span class="feedback-reveal">答案：' + currentData.money.answer + ' 元</span>';
}
function revealDate() {
  const a = currentData.date.answer;
  els.dateFeedback.innerHTML = '<span class="feedback-reveal">答案：' + a.year + ' 年 ' + a.month + ' 月 ' + a.day + ' 日</span>';
}
function revealTime() {
  const a = currentData.time.answer;
  els.timeFeedback.innerHTML = '<span class="feedback-reveal">答案：' + a.hour + ' 點 ' + a.minute + ' 分</span>';
}

// ---------- 繁簡切換 ----------
function setScript(script) {
  currentScript = script;
  els.btnTrad.classList.toggle('active', script === 'trad');
  els.btnSimp.classList.toggle('active', script === 'simp');
}

// ---------- 初始化與事件綁定 ----------
document.addEventListener('DOMContentLoaded', () => {
  currentData.phone = generatePhone();
  currentData.money = generateMoney();
  currentData.date = generateDate();
  currentData.time = generateTime();

  els.btnTrad.addEventListener('click', () => setScript('trad'));
  els.btnSimp.addEventListener('click', () => setScript('simp'));

  els.phoneSpeak.addEventListener('click', () => speakText(currentData.phone.text, true, els.phoneWarning, 'phone'));
  els.moneySpeak.addEventListener('click', () => speakText(currentData.money.text, false, els.moneyWarning, 'money'));
  els.dateSpeak.addEventListener('click', () => speakText(currentData.date.text, false, els.dateWarning, 'date'));
  els.timeSpeak.addEventListener('click', () => speakText(currentData.time.text, false, els.timeWarning, 'time'));

  els.phoneNext.addEventListener('click', nextPhone);
  els.moneyNext.addEventListener('click', nextMoney);
  els.dateNext.addEventListener('click', nextDate);
  els.timeNext.addEventListener('click', nextTime);

  els.phoneReveal.addEventListener('click', revealPhone);
  els.moneyReveal.addEventListener('click', revealMoney);
  els.dateReveal.addEventListener('click', revealDate);
  els.timeReveal.addEventListener('click', revealTime);

  els.phoneCheck.addEventListener('click', gradePhone);
  els.moneyCheck.addEventListener('click', gradeMoney);
  els.dateCheck.addEventListener('click', gradeDate);
  els.timeCheck.addEventListener('click', gradeTime);

  const handleEnter = (e, gradeFunc) => {
    if (e.key === 'Enter') { e.preventDefault(); gradeFunc(); }
  };
  els.phoneInput.addEventListener('keydown', (e) => handleEnter(e, gradePhone));
  els.moneyInput.addEventListener('keydown', (e) => handleEnter(e, gradeMoney));
  [els.dateYear, els.dateMonth, els.dateDay].forEach(input => {
    input.addEventListener('keydown', (e) => handleEnter(e, gradeDate));
  });
  [els.timeHour, els.timeMinute].forEach(input => {
    input.addEventListener('keydown', (e) => handleEnter(e, gradeTime));
  });

  els.phoneInput.addEventListener('blur', gradePhone);
  els.moneyInput.addEventListener('blur', gradeMoney);
  [els.dateYear, els.dateMonth, els.dateDay].forEach(input => {
    input.addEventListener('blur', gradeDate);
  });
  [els.timeHour, els.timeMinute].forEach(input => {
    input.addEventListener('blur', gradeTime);
  });

  Object.keys(scores).forEach(k => {
    const a = document.getElementById(k + '-answered');
    const c = document.getElementById(k + '-correct');
    if (a) a.textContent = scores[k].answered;
    if (c) c.textContent = scores[k].correct;
  });
});
</script>
</body>
</html>
