<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>聽數字</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1521;--surface:#1a2235;--surface2:#222d42;--border:#2d3d5a;
  --blue:#4a7fd4;--blue-light:#6b9be8;--blue-glow:rgba(74,127,212,0.3);
  --green:#3db87a;--green-glow:rgba(61,184,122,0.25);
  --red:#e05555;--red-glow:rgba(224,85,85,0.25);
  --gold:#f0b429;--gold-glow:rgba(240,180,41,0.25);
  --text:#e8edf5;--text-mid:#8fa3c0;--text-muted:#4d6080;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-weight:400;min-height:100vh;overflow-x:hidden;font-size:18px}

/* ── SITE HEADER ── */
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.site-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--gold);flex:1}
.site-sub{font-size:12px;color:var(--text-muted)}

/* ── SCREENS ── */
.screen{display:none;min-height:calc(100vh - 57px);flex-direction:column}
.screen.active{display:flex}

/* ── PORTAL (課次選單) ── */
#portal{background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg);padding:32px 20px;align-items:center}
.portal-heading{text-align:center;margin-bottom:28px}
.portal-heading h2{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;margin-bottom:6px}
.portal-heading p{font-size:14px;color:var(--text-muted)}
.lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%;max-width:600px}
.lesson-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 14px;cursor:pointer;transition:all .2s;text-align:center}
.lesson-card:hover:not(.locked){border-color:var(--blue);background:var(--surface2);transform:translateY(-2px)}
.lesson-card.locked{opacity:.35;cursor:default}
.lesson-card.pinyin-card{border-color:var(--border);background:var(--surface)}
.lesson-card.pinyin-card:hover{border-color:var(--blue);background:var(--surface2);transform:translateY(-2px)}
.lesson-card .d-num{font-size:13px;font-family:monospace;color:var(--blue-light);margin-bottom:6px;letter-spacing:1px}
.lesson-card .d-title{font-size:14px;font-weight:500;line-height:1.4}
.portal-credit{margin-top:32px;font-size:12px;color:var(--text-muted);text-align:center;line-height:2}

/* ── LESSON HOME ── */
#lesson-home{background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg);padding:28px 20px;align-items:center}
.lesson-home-header{text-align:center;margin-bottom:28px;width:100%;max-width:460px}
.lesson-badge{display:inline-block;background:var(--blue-glow);border:1px solid var(--blue);color:var(--blue-light);font-size:12px;letter-spacing:3px;padding:5px 16px;border-radius:20px;margin-bottom:14px;cursor:pointer}
.lesson-badge:hover{background:var(--blue);color:#fff}
.lesson-title{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:700;line-height:1.4;margin-bottom:6px}
.lesson-title span{color:var(--blue-light)}
.lesson-info{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:460px;margin-bottom:22px;font-size:14px;color:var(--text-mid);line-height:1.8}
.modes-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:460px}
.mode-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 14px;cursor:pointer;transition:all .2s;text-align:center;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mode-btn:hover{border-color:var(--blue);background:var(--surface2);transform:translateY(-2px)}
.mode-btn.tone-btn{background:var(--surface);border-color:var(--border)}
.mode-btn.tone-btn:hover{background:var(--surface2);border-color:var(--blue);transform:translateY(-2px)}
.mode-icon{font-size:36px;margin-bottom:10px}
.mode-name{font-size:20px;font-weight:700;margin-bottom:0}
.mode-desc{display:none}

/* ── GAME HEADER ── */
.game-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:57px;z-index:50}
.back-btn{background:none;border:none;color:var(--text-mid);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all .15s}
.back-btn:hover{color:var(--text);background:var(--surface2)}
.game-title{font-size:17px;font-weight:500;flex:1}
.progress-bar{height:5px;background:var(--border);border-radius:3px;flex:1;overflow:hidden;min-width:40px}
.progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .4s}
.score-badge{background:var(--surface2);border:1px solid var(--border);color:var(--gold);font-size:14px;padding:5px 12px;border-radius:20px;white-space:nowrap}
.game-body{padding:24px 18px;max-width:520px;margin:0 auto;width:100%;flex:1}

/* ── FLASHCARDS ── */
.fc-counter{text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:16px;letter-spacing:1px}
.fc-wrap{perspective:1000px;margin-bottom:18px}
.fc-card{width:100%;height:360px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:24px}
.fc-back{transform:rotateY(180deg);background:var(--surface2);border-color:var(--blue)}
.fc-hint{font-size:12px;letter-spacing:2px;color:var(--text-muted);margin-bottom:10px}
.fc-ruby-pair{display:inline-flex;flex-direction:column;align-items:center;margin:0 3px}
.fc-ruby-py{font-size:17px;color:var(--blue-light);font-family:'Noto Sans TC',sans-serif;font-weight:600;letter-spacing:0.5px;line-height:1.4;text-align:center;min-width:1em}
.fc-ruby-ch{font-family:'Noto Serif TC',serif;font-size:42px;font-weight:700;color:var(--text);line-height:1.2;text-align:center}
.fc-ruby-punct{font-family:'Noto Serif TC',serif;font-size:36px;font-weight:700;color:var(--text);line-height:1.2;align-self:flex-start;padding-top:4px}
.fc-char{font-family:'Noto Serif TC',serif;font-size:52px;font-weight:700;color:var(--text);margin-bottom:6px;text-align:center;line-height:1.2}
.fc-pinyin{font-size:19px;color:var(--blue-light);margin-bottom:4px;letter-spacing:1px}
.fc-meaning{font-size:17px;color:var(--text-mid);text-align:center}
.fc-example{font-size:24px;color:var(--text-muted);margin-top:8px;text-align:center;line-height:1.7}
.fc-sound-row{display:flex;justify-content:center;margin-bottom:16px}
.fc-sound-btn{background:var(--blue-glow);border:1px solid var(--blue);color:var(--blue-light);border-radius:50%;width:52px;height:52px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.fc-sound-btn:hover{background:var(--blue);color:#fff}
.fc-sound-btn.playing{animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 var(--blue-glow)}to{box-shadow:0 0 0 12px transparent}}
.fc-controls{display:flex;gap:12px;justify-content:center}
.fc-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:12px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.fc-btn.next{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── MEMORY ── */
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.mm-tile{width:100%;aspect-ratio:1;min-height:100px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all .2s;text-align:center;padding:12px;line-height:1.4;position:relative;overflow:hidden}
.mm-tile::before{content:'';position:absolute;inset:0;background:var(--surface2);transition:opacity .25s;opacity:1}
.mm-tile.revealed::before,.mm-tile.matched::before{opacity:0}
.mm-tile.matched{border-color:var(--green);background:rgba(61,184,122,.1)}
.mm-tile.wrong{border-color:var(--red);animation:shake .3s}
.mm-tile-inner{position:relative;z-index:1;font-size:30px}
.mm-tile:hover:not(.matched){border-color:var(--blue)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mm-stats{display:flex;justify-content:space-between;font-size:14px;color:var(--text-mid);margin-bottom:16px}

/* ── TONE QUIZ (gold theme) ── */
.tq-char-box{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;margin-bottom:16px}
.tq-char{font-family:'Noto Serif TC',serif;font-size:64px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:4px}
.tq-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tq-btn{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 10px;font-size:24px;color:var(--text);cursor:pointer;transition:all .15s;text-align:center;font-family:'Noto Sans TC',sans-serif;letter-spacing:1px}
.tq-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(240,180,41,0.08)}
.tq-btn.selected{background:rgba(240,180,41,0.15);border-color:var(--gold);color:var(--gold);transform:scale(1.03)}.tq-btn.correct{background:var(--green-glow);border-color:var(--green);color:#7de8b0}
.tq-btn.wrong{background:var(--red-glow);border-color:var(--red);color:#ff8a8a}
.tq-submit{background:var(--gold);color:#1a1000;border:none;border-radius:12px;padding:15px;width:100%;font-size:16px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:700}
.tq-submit:disabled{opacity:.4;cursor:default}

/* ── NUMBER DICTATION (inside tone quiz screen) ── */
.nd-card{background:rgba(240,180,41,0.08);border:2px solid var(--gold);border-radius:20px;padding:32px 24px;text-align:center;margin-bottom:18px;cursor:pointer;position:relative}
.nd-question{font-size:22px;color:var(--gold);font-weight:700;margin-bottom:8px;letter-spacing:4px}
.nd-hint{font-size:12px;color:var(--text-muted);letter-spacing:2px}
.nd-answer{font-size:28px;font-weight:700;color:var(--text);display:none;margin-top:12px}
.nd-pinyin{font-size:20px;color:var(--blue-light);margin-top:6px;display:none}
.nd-sound-row{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.nd-btn-row{display:flex;gap:10px;margin-bottom:10px}
.nd-btn{background:rgba(240,180,41,0.12);border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;flex:1;transition:all .15s}
.nd-btn:hover{background:rgba(240,180,41,0.25)}
.nd-counter{font-size:12px;color:var(--text-muted);text-align:center;letter-spacing:1px;margin-bottom:10px}
.nd-mode-tabs{display:flex;gap:10px;margin-bottom:20px}
.nd-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);font-size:14px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;text-align:center;transition:all .15s}
.nd-tab.active{border-color:var(--gold);background:rgba(240,180,41,0.1);color:var(--gold)}

/* ── DIALOGUE ── */
.df-prompt{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;font-size:24px;color:var(--text);margin-bottom:16px;line-height:1.8;text-align:center}
.df-label{font-size:14px;color:var(--text-muted);letter-spacing:2px;display:block;margin-bottom:8px}
.df-choices{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.df-choice{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:24px 18px;font-size:24px;cursor:pointer;transition:all .2s;text-align:center;font-family:'Noto Sans TC',sans-serif;color:var(--text)}
.df-choice:hover:not(.disabled){border-color:var(--blue);background:var(--surface2)}
.df-choice.correct{background:var(--green-glow);border-color:var(--green);color:#7de8b0}
.df-choice.wrong{background:var(--red-glow);border-color:var(--red);color:#ff8a8a}
.df-choice.disabled{cursor:default}
.df-feedback{border-radius:12px;padding:14px 16px;font-size:15px;margin-top:10px;line-height:1.7;display:none}
.df-feedback.correct{background:var(--green-glow);border:1px solid var(--green);color:var(--green)}
.df-feedback.wrong{background:var(--red-glow);border:1px solid var(--red);color:#ff8a8a}

/* ── SENTENCE ── */
.s2-prompt{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;font-size:22px;color:var(--text);margin-bottom:16px;line-height:1.8}
.s2-answer-area{min-height:120px;background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;transition:border-color .2s}
.s2-answer-area.has-content{border-color:var(--blue)}
.s2-tile{background:var(--blue);color:#fff;border-radius:10px;padding:12px 18px;cursor:pointer;user-select:none;text-align:center}
.s2-tile .tile-cn{font-size:24px;font-weight:500}
.s2-tile .tile-py{font-size:13px;opacity:.8;margin-top:2px}
.s2-bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.s2-bank-tile{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 18px;cursor:pointer;user-select:none;text-align:center}
.s2-bank-tile .tile-cn{font-size:24px;font-weight:500}
.s2-bank-tile .tile-py{font-size:13px;color:var(--text-muted);margin-top:2px}
.s2-bank-tile:hover:not(.used){border-color:var(--blue)}
.s2-bank-tile.used{opacity:.25;pointer-events:none}
.s2-actions{display:flex;gap:10px}
.s2-check{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:13px 24px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;flex:1}
.s2-clear{background:var(--surface2);color:var(--text-mid);border:1px solid var(--border);border-radius:10px;padding:13px 18px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.s2-feedback{border-radius:10px;padding:14px 16px;font-size:15px;margin-top:12px;line-height:1.8;display:none}
.s2-feedback.correct{background:var(--green-glow);border:1px solid var(--green);color:var(--green)}
.s2-feedback.wrong{background:var(--red-glow);border:1px solid var(--red);color:#ff8a8a}

/* ── RESULT ── */
.result-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.result-circle{width:130px;height:130px;border-radius:50%;background:var(--surface);border:3px solid var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 0 40px var(--blue-glow)}
.result-score{font-size:40px;font-weight:700;color:var(--blue-light)}
.result-total{font-size:13px;color:var(--text-muted)}
.result-msg{font-size:22px;font-weight:500;margin-bottom:8px}
.result-sub{font-size:14px;color:var(--text-mid);margin-bottom:32px}
.result-btns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:280px}
.result-retry{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.result-home{background:var(--surface);color:var(--text-mid);border:1px solid var(--border);border-radius:12px;padding:15px;font-size:16px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}

/* ── PINYIN CHART ── */
#pinyin-chart{background:var(--bg);overflow:auto}
.py-chart-wrap{padding:20px 10px;max-width:100%;overflow-x:auto}
.py-table{border-collapse:collapse;min-width:700px;font-size:13px}
.py-table th,.py-table td{border:1px solid var(--border);padding:6px 8px;text-align:center;min-width:42px}
.py-table thead th{background:#0d3a4a;color:#4dd8f0;font-weight:600;font-size:12px;letter-spacing:.5px}
.py-table tbody td:first-child{background:#0d3a4a;color:#4dd8f0;font-weight:600;font-size:12px}
.py-cell{cursor:pointer;border-radius:6px;padding:4px 2px;transition:background .15s;position:relative}
.py-cell:hover{background:rgba(74,127,212,.25)}
.py-cell.empty{cursor:default;color:transparent}
/* tone popup */
.tone-popup{position:fixed;background:var(--surface2);border:2px solid var(--gold);border-radius:16px;padding:18px 22px;z-index:999;box-shadow:0 8px 40px rgba(0,0,0,.6);min-width:220px;display:none}
.tone-popup h3{font-size:18px;color:var(--gold);margin-bottom:12px;text-align:center}
.tone-popup .tone-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tone-pill{background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--text);transition:all .15s;letter-spacing:1px}
.tone-pill:hover{border-color:var(--blue);background:var(--blue-glow);color:var(--blue-light)}
.tone-popup-close{position:absolute;top:8px;right:12px;background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer}
.py-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--text-muted);margin-bottom:12px;padding:0 10px}

.q-num{font-size:12px;color:var(--text-muted);letter-spacing:2px;margin-bottom:14px}
/* ── EMOJI MEMORY ── */
.mm-tile-emoji{font-size:80px;line-height:1}
.mm-tile-cn{font-size:32px;font-weight:600;margin-top:2px}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s cubic-bezier(.34,1.56,.64,1)}

/* ── 課堂用語 FLASHCARD ── */
.cl-fc-char{font-family:'Noto Serif TC',serif;font-size:38px;font-weight:700;color:var(--text);margin-bottom:8px;text-align:center;line-height:1.3}
.cl-fc-pinyin{font-size:16px;color:var(--blue-light);margin-bottom:6px;letter-spacing:1px;text-align:center}
.cl-fc-meaning{font-size:20px;color:var(--text-mid);text-align:center}

/* ── 口說練習 SPEAKING PRACTICE ── */
.sp-phrase-box{background:var(--surface2);border:2px solid var(--blue);border-radius:18px;padding:28px 20px;text-align:center;margin-bottom:20px}
.sp-phrase-zh{font-family:'Noto Serif TC',serif;font-size:32px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.4}
.sp-phrase-py{font-size:15px;color:var(--blue-light);letter-spacing:1px;margin-bottom:4px}
.sp-phrase-jp{font-size:16px;color:var(--text-muted)}
.sp-phrase-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.sp-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-mid);border-radius:10px;padding:8px 18px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.sp-nav-btn:hover{border-color:var(--blue);color:var(--text)}
.sp-phrase-count{font-size:13px;color:var(--text-muted);letter-spacing:1px}
.sp-controls{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.sp-mic-btn{background:var(--blue-glow);border:2px solid var(--blue);color:var(--blue-light);border-radius:50%;width:72px;height:72px;font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.sp-mic-btn:hover{background:var(--blue);color:#fff}
.sp-mic-btn.recording{background:var(--red-glow);border-color:var(--red);color:var(--red);animation:pulse .6s infinite alternate}
.sp-submit-btn{background:var(--green);border:none;color:#fff;border-radius:14px;padding:0 24px;font-size:16px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:700;transition:all .2s;opacity:.5;pointer-events:none}
.sp-submit-btn.ready{opacity:1;pointer-events:auto}
.sp-transcript-box{background:var(--surface);border:2px dashed var(--border);border-radius:14px;padding:18px;min-height:60px;margin-bottom:16px;font-size:22px;color:var(--text);text-align:center;position:relative;transition:border-color .2s}
.sp-transcript-box.has-text{border-color:var(--blue)}
.sp-transcript-placeholder{color:var(--text-muted);font-size:15px;letter-spacing:1px}

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:#1a1a2e;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
#app{background:#16213e;border-radius:20px;padding:2rem;max-width:760px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.5);border:1px solid #0f3460}

h1{font-size:24px;font-weight:700;color:#e2e8f0;margin-bottom:4px;letter-spacing:1px}
.sub{font-size:13px;color:#64748b;margin-bottom:1.5rem}

/* Start Screen */
.start-card{background:#0f3460;border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1rem;border:1px solid #1e5799}
.start-card p{font-size:15px;color:#94a3b8;margin-bottom:1.5rem;line-height:1.8}
.tog{font-size:14px;color:#94a3b8;display:inline-flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:1.5rem;user-select:none}
.tog input{accent-color:#4d9de0;width:16px;height:16px}

/* Stats bar */
.stats{display:flex;gap:10px;margin-bottom:1rem}
.st{flex:1;background:#0f3460;border-radius:12px;padding:12px;text-align:center;border:1px solid #1e5799}
.stn{font-size:26px;font-weight:700;color:#e2e8f0}
.stl{font-size:11px;color:#64748b;margin-top:2px;letter-spacing:.5px}

/* Display area - KTV style */
.darea{background:#0a0a1a;border-radius:14px;padding:1.5rem 1.5rem 1rem;margin-bottom:1rem;min-height:130px;border:1px solid #0f3460;position:relative}
.dtitle{font-size:12px;color:#4d9de0;margin-bottom:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.cw{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 0}

/* Character cells */
.ch{display:inline-flex;flex-direction:column;align-items:center;margin:2px 3px;transition:transform .1s}
.hz{font-size:32px;line-height:1.15;padding:2px 5px;border-radius:5px;transition:color .12s,background .12s,text-shadow .12s}
.py{font-size:10px;min-height:14px;text-align:center;letter-spacing:.3px;transition:color .12s}

/* States */
.ch.pending .hz{color:#334155}
.ch.pending .py{color:#1e3a5f}

.ch.cur .hz{color:#fff;background:#4d9de0;text-shadow:0 0 12px rgba(77,157,224,.8);animation:pulse .8s ease-in-out infinite}
.ch.cur .py{color:#7eb8e8}

.ch.correct .hz{color:#60c8ff;text-shadow:0 0 8px rgba(96,200,255,.5)}
.ch.correct .py{color:#2a6a9a}

.ch.wrong .hz{color:#ff6b8a;text-shadow:0 0 8px rgba(255,107,138,.6)}
.ch.wrong .py{color:#7a2030}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(77,157,224,.4)}50%{box-shadow:0 0 0 6px rgba(77,157,224,0)}}

/* Input */
.inp-wrap{position:relative;margin-bottom:.75rem}
textarea#inp{width:100%;padding:14px 18px;font-size:20px;border-radius:12px;border:2px solid #0f3460;background:#0a0a1a;color:#e2e8f0;outline:none;resize:none;height:64px;overflow:hidden;font-family:inherit;display:block;transition:border-color .2s,box-shadow .2s}
textarea#inp:focus{border-color:#4d9de0;box-shadow:0 0 0 4px rgba(77,157,224,.15)}
.hint{font-size:12px;color:#334155;line-height:1.6;margin-bottom:1rem}

/* Output button */
.btn-out{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#4d9de0,#185FA5);color:#fff;cursor:pointer;font-size:16px;font-family:inherit;font-weight:700;letter-spacing:1px;transition:opacity .2s,transform .1s;margin-bottom:.5rem}
.btn-out:hover{opacity:.9}
.btn-out:active{transform:scale(.98)}

/* Result */
.rc{background:#0f3460;border-radius:16px;padding:2.5rem;text-align:center;border:1px solid #1e5799}
.rc-label{font-size:13px;color:#64748b;letter-spacing:1px;margin-bottom:.5rem}
.big{font-size:64px;font-weight:700;color:#60c8ff;margin:.25rem 0;text-shadow:0 0 20px rgba(96,200,255,.4)}
.big span{font-size:22px;font-weight:400;color:#94a3b8}
.enc{font-size:20px;font-weight:700;color:#ffd166;margin:1rem 0 .5rem;letter-spacing:.5px}
.meta{font-size:14px;color:#64748b;margin-bottom:1.5rem}
.meta b{color:#94a3b8}
.btns{display:flex;gap:12px;justify-content:center}
button.btnp{padding:12px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,#4d9de0,#185FA5);color:#fff;cursor:pointer;font-size:15px;font-family:inherit;font-weight:700;transition:opacity .2s}
button.btns2{padding:12px 24px;border-radius:12px;border:2px solid #0f3460;background:transparent;color:#94a3b8;cursor:pointer;font-size:15px;font-family:inherit;transition:background .2s}
button.btnp:hover{opacity:.85}
button.btns2:hover{background:#0f3460}

.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}

/* Streak flash */
.correct-flash{animation:flash .25s ease-out}
@keyframes flash{0%{background:#0d2a1a}100%{background:#0a0a1a}}

<body>
<div class="screen" id="listen-num-screen" style="flex-direction:column;min-height:100vh;width:100%;overflow:auto">
  <div class="game-header">
    <button class="back-btn" onclick="location.reload()">←</button>
    <span class="game-title">🔢 總複習－聽數字</span>
  </div>
  <div style="flex:1;display:flex;justify-content:center;align-items:center;padding:32px 20px;background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg)">
    <div style="width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px 32px;text-align:center">
      <h2 style="font-family:'Noto Serif TC',serif;font-size:1.8rem;font-weight:700;color:var(--text);margin-bottom:28px">總複習－聽數字</h2>
      <div id="ln-speaker-btn" style="background:var(--blue-glow);border:1px solid var(--blue);color:var(--blue-light);display:inline-block;padding:16px 40px;border-radius:40px;font-size:1.5rem;font-weight:700;cursor:pointer;margin:0 0 28px;transition:all .15s;letter-spacing:1px">🔊 朗讀題目</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px">
        <input type="text" id="ln-input" style="flex:2;min-width:180px;padding:14px 20px;font-size:1.3rem;border:1px solid var(--border);border-radius:40px;text-align:center;font-weight:500;background:var(--surface2);color:var(--text);font-family:'Noto Sans TC',sans-serif;outline:none" placeholder="請輸入數字" autocomplete="off" inputmode="numeric">
        <button id="ln-submit-btn" style="background:var(--blue);border:none;color:#fff;padding:14px 28px;border-radius:40px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif">答案</button>
      </div>
      <div id="ln-feedback" style="font-size:1.3rem;margin:16px 0;padding:14px 20px;border-radius:40px;font-weight:500;min-height:54px"></div>
      <button id="ln-next-btn" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 32px;border-radius:40px;font-size:1.1rem;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;margin-top:8px">下一題</button>
      <div style="font-size:0.95rem;margin-top:24px;color:var(--text-muted)">已答 <span id="ln-answered" style="color:var(--gold);font-weight:700">0</span> 題・正確 <span id="ln-correct" style="color:var(--gold);font-weight:700">0</span> 題</div>
    </div>
  </div>
<script>
function shuffle(a){ return [...a].sort(() => Math.random() - .5) }
function speak(text){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  // 修正 TTS 發音：面→麵（確保讀 miàn）；還→環（確保讀 huán）；不舒服的服讀輕聲
  text = text.replace(/面/g, '麵').replace(/還書/g, '環書').replace(/不舒服/g, '不舒fu').replace(/背著/g, '揹著').replace(/連假/g, '連價').replace(/為什麼/g, '喂什麼').replace(/教和服/g, '交和服').replace(/教浴衣/g, '交浴衣').replace(/好耶！/g, '好！').replace(/好耶/g, '好').replace(/出身地/g, '出身帝').replace(/出生地/g, '出生帝');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.45;

  function doSpeak(){
    const voices = window.speechSynthesis.getVoices();
    // 優先選擇正統台灣華語語音
    const twVoice =
      voices.find(v => v.lang === 'zh-TW' && /Taiwan|Meijia|Tingting|Yating/i.test(v.name)) ||
      voices.find(v => v.lang === 'zh-TW') ||
      voices.find(v => v.lang.startsWith('zh'));
    if (twVoice) u.voice = twVoice;
    window.speechSynthesis.speak(u);
  }

  if (window.speechSynthesis.getVoices().length > 0) {
    doSpeak();
  } else {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.onvoiceschanged = null;
      doSpeak();
    };
  }
}
const LN_MEASURE=['位','個','條','本','杯','塊','盤','份','斤','盒','箱','粒'];
const LN_PHONES=['08038622941','035214985','0225971564'];
let lnQ=null,lnAnswered=0,lnCorrect=0,lnCurrentCorrect=false;

function lnRandInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function lnPhoneSpeech(p){const m={'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};return p.split('').map(c=>m[c]||c).join(' ');}
function lnYearSpeech(y){const s=y.toString();let r='';const ns=['零','一','二','三','四','五','六','七','八','九'];for(let i=0;i<s.length;i++)r+=ns[parseInt(s[i])];return r+'年';}
function lnGenQ(){
  const r=Math.random();
  if(r<0.2){const p=LN_PHONES[Math.floor(Math.random()*LN_PHONES.length)];return{type:'phone',ans:p,speech:lnPhoneSpeech(p)};}
  if(r<0.5){const y=lnRandInt(1950,2026);return{type:'year',ans:y,speech:lnYearSpeech(y)};}
  if(r<0.8){const m=lnRandInt(10,99999);return{type:'money',ans:m,speech:m+'元'};}
  let n;const rs=Math.random();
  if(rs<0.7)n=lnRandInt(1,99);else if(rs<0.9)n=lnRandInt(100,999);else n=lnRandInt(1000,5000);
  const mw=LN_MEASURE[Math.floor(Math.random()*LN_MEASURE.length)];
  return{type:'measure',ans:n,speech:n+mw};
}
function lnLoadSave(){
  try{lnAnswered=parseInt(localStorage.getItem('ln2_ans')||0);lnCorrect=parseInt(localStorage.getItem('ln2_cor')||0);}catch(e){}
  document.getElementById('ln-answered').textContent=lnAnswered;
  document.getElementById('ln-correct').textContent=lnCorrect;
}
function lnSave(){try{localStorage.setItem('ln2_ans',lnAnswered);localStorage.setItem('ln2_cor',lnCorrect);}catch(e){}}
function lnNewQ(){
  lnQ=lnGenQ();lnCurrentCorrect=false;
  document.getElementById('ln-input').value='';
  const fb=document.getElementById('ln-feedback');fb.innerHTML='';fb.style.cssText='font-size:1.3rem;margin:16px 0;padding:14px 20px;border-radius:40px;font-weight:500;min-height:54px';
}
function lnNumToChinese(n){
  if(n===0)return'零';
  const digits=['零','一','二','三','四','五','六','七','八','九'];
  const units=['','十','百','千','萬'];
  let result='',s=n.toString();
  if(n<10)return digits[n];
  if(n<100){const t=Math.floor(n/10);const o=n%10;return(t===1?'十':digits[t]+'十')+(o?digits[o]:'');}
  if(n<1000){const h=Math.floor(n/100);const r=n%100;const mid=r<10&&r>0?'零'+digits[r]:r===0?'':lnNumToChinese(r);return digits[h]+'百'+mid;}
  if(n<10000){const th=Math.floor(n/1000);const r=n%1000;const mid=r<100&&r>0?'零'+lnNumToChinese(r):r===0?'':lnNumToChinese(r);return digits[th]+'千'+mid;}
  const wan=Math.floor(n/10000);const r=n%10000;const mid=r<1000&&r>0?'零'+lnNumToChinese(r):r===0?'':lnNumToChinese(r);
  return lnNumToChinese(wan)+'萬'+mid;
}
function lnBuildSpeech(q){
  if(q.type==='phone')return q.speech;
  if(q.type==='year')return q.speech;
  if(q.type==='money')return lnNumToChinese(q.ans)+'元';
  if(q.type==='measure')return lnNumToChinese(q.ans)+q.speech.replace(/^[0-9]+/,'');
  return q.speech;
}
function lnSpeak(){
  if(!lnQ)lnNewQ();
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const text=lnBuildSpeech(lnQ);
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW';u.rate=0.85;
    const voices=window.speechSynthesis.getVoices();
    const twVoice=voices.find(v=>v.lang==='zh-TW'&&/Taiwan|Meijia|Tingting|Yating/i.test(v.name))||voices.find(v=>v.lang==='zh-TW')||voices.find(v=>v.lang.startsWith('zh'));
    if(twVoice)u.voice=twVoice;
    window.speechSynthesis.speak(u);
  }
}
function lnCheck(){
  if(!lnQ)return;
  const fb=document.getElementById('ln-feedback');
  if(lnCurrentCorrect){fb.textContent='✅ 已答對！按下一題。';fb.style.background='var(--green-glow)';fb.style.border='1px solid var(--green)';fb.style.color='var(--green)';return;}
  const val=document.getElementById('ln-input').value.trim();
  if(!val){fb.textContent='請輸入數字';fb.style.background='var(--red-glow)';fb.style.border='1px solid var(--red)';fb.style.color='var(--red)';return;}
  let ok=false;
  if(lnQ.type==='phone'){ok=(val===lnQ.ans.toString());}
  else{const n=Number(val);if(!isNaN(n))ok=(n===lnQ.ans);}
  if(ok){
    lnCurrentCorrect=true;lnAnswered++;lnCorrect++;
    document.getElementById('ln-answered').textContent=lnAnswered;
    document.getElementById('ln-correct').textContent=lnCorrect;
    lnSave();fb.textContent='✅ 答對了，好棒！';fb.style.background='var(--green-glow)';fb.style.border='1px solid var(--green)';fb.style.color='var(--green)';
  }else{fb.textContent='❌ 不對哦！再一次。';fb.style.background='var(--red-glow)';fb.style.border='1px solid var(--red)';fb.style.color='var(--red)';}
}
function initListenNum(){
  lnLoadSave();lnNewQ();
  document.getElementById('ln-speaker-btn').onclick=lnSpeak;
  document.getElementById('ln-submit-btn').onclick=lnCheck;
  document.getElementById('ln-next-btn').onclick=lnNewQ;
  document.getElementById('ln-input').addEventListener('keypress',e=>{if(e.key==='Enter')lnCheck();});
}

window.addEventListener('load', initListenNum);
</script>
</body>
